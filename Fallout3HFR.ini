[Timing]
; Read-only CSV telemetry. This does not change game behavior by itself.
bTelemetry=1

; Research-only. It bypasses BSTimer's 10 ms sleep and alternates a fixed
; simulation-sized delta with near-zero-delta presentation passes. This is NOT
; yet event-safe decoupling and therefore defaults to off.
bExperimentalQuantizedDelta=0

; Arms every enabled experiment from process start instead of waiting for the
; launcher's capture event. Off by default.
bArmAtStartup=0

; Suppresses per-frame CSV rows and the input ledger; the periodic status line
; in Fallout3HFR.log is still written. Use with bArmAtStartup for normal play.
bQuietTelemetry=0
fSimulationHz=60.0

; Clamp wall-clock backlog after breakpoints, loading, or suspension.
fMaxWallDeltaMs=250.0

[Tracing]
; Non-mutating Milestone 2 coarse and nested late-frame probes.
; Disabled in the normal observer because the extra events affect performance.
bFrameRegionTelemetry=0

; Adds read-only hashes and explanatory raw fields for player/game-time/physics/
; save-facing state and audio queues at each frame probe. Enabling this also
; installs the frame probes even when bFrameRegionTelemetry is zero.
bAuthoritativeStateTelemetry=0

; Adds cumulative read-only entry counters for ScriptRunner::Run,
; BSAnimNoteReceiver dispatch, BSSoundHandle::Play, the OS input poll, and the
; D3D9 Present wrapper. Enabling this also installs the frame probes so counter
; transitions can be localized to frame boundaries.
bEventDispatchTelemetry=0

; Read-only, lower-volume scene-transform observer. It installs the existing
; frame-call trampolines needed by the HUD no-sleep hook, but emits snapshots
; only at camera publication (2020/2021) and live scene draw (705/706). Each
; snapshot records the player reference root, third-person skeleton root,
; first-person skeleton root, and PlayerCharacter's first-person node.
bSceneTransformTelemetry=0

[Experiments]
; Research-only. Reports one processor only while the monolithic frame runs so
; Bethesda's paired single-CPU dispatch/completion paths are selected. This can
; affect more than rendering and is not a timing or decoupling fix.
bExperimentalSingleCoreFrame=0

; Research-only. Repeats the full-resolution FUN_006EB5E0 scene draw once
; while its state-2 render target is still active. The stock call runs first;
; replay requires a valid player/cell and 240 consecutive eligible frames.
; Marker 1102 proves replay, and no second Present is added.
bExperimentalSceneDrawReplay=0

; Research-only. After the normal renderer finalizer has Presented and returned
; to idle state 0, repeats the stock render dispatcher with its preserved owner
; and zero arguments, then runs the finalizer again for a second Present.
; Requires a valid stable player/cell for 240 calls; marker 1201 proves entry.
bExperimentalPostPresentReplay=0

; Research-only modifier for the post-Present replay. Restores the renderer's
; pre-Present frame ID before the second render so both passes have one logical
; identity. Marker 1202 records state after the second finalizer.
bExperimentalPostPresentSameFrameId=0

; Research-only ownership probe. During an externally gated capture, validates
; one complete normal eight-pass final-composite graph, adds one intrusive
; reference to each of its three non-null leaf resources at marker 1321, and
; releases those references after the stock Present at marker 402. It issues
; no draw, finalizer, or additional Present and requires event-dispatch tracing.
bExperimentalLeafResourceRetention=0

; Research-only narrow replay. Requires the retention experiment and the
; external capture gate. After 240 stable eligible world frames, binds the
; retained resources through private wrappers, invokes only the captured final
; image-space leaf, then uses the stock finalizer for one additional Present.
bExperimentalPostPresentLeafReplay=0

; Research-only and capture-gated. Replaces only HUDMainMenu's per-frame
; embedded timer update with the same real-time field update but omits its
; explicit wait-to-10-ms Sleep. Other timer users and later HUD work remain
; unchanged. This is not yet a validated fix and defaults to off.
bExperimentalHUDTimerNoSleep=0

; Research-only and capture-gated. During the validated live-scene draw only,
; interpolates first-person camera world position between the two latest fixed
; samples while preserving the engine's accepted/clamped rotation. The exact
; stock position is restored before returning to engine code. Telemetry
; markers 2030/2031/2032 prove apply/draw/restore; 2033 permanently fails the
; experiment closed after a restoration or hierarchy mismatch.
bExperimentalRenderCameraPositionInterpolation=0

; Research-only and capture-gated. Uses the proven fixed-pulse future player
; translation published before marker 2020 and the current draw pose at marker
; 705 to derive a phase-correct render translation. It temporarily offsets the
; camera and four player-owned root world translations during the one stock
; scene draw, then restores their exact bytes. Markers 2040/2041/2042 prove
; apply/draw/restore; 2043 permanently fails the experiment closed.
bExperimentalRenderTranslationInterpolation=0

; Research-only and capture-gated; requires bExperimentalQuantizedDelta. On
; non-tick frames, sets the engine's own freeze-time flag (TESMain+7, the flag
; behind the console's "tfc 1") for the duration of the frame, so the stock
; frame skips its world, actor-process and worker calls while input, camera
; and rendering still run. Never applied in menus, loading, fly-cam, or
; without a loaded cell. Telemetry marker 2100 marks every frozen frame.
bExperimentalFreezeRenderFrames=0

; Research-only and capture-gated; requires bExperimentalQuantizedDelta. Sets
; Havok's maximum step (fMaxTime) equal to the simulation tick so no remainder
; builds up and physics steps only on tick frames. The original value is
; restored when the capture gate closes.
bExperimentalAlignHavokStep=0

; Research-only and capture-gated; requires bExperimentalQuantizedDelta. Makes
; key and mouse-button press/release edges visible only to the player handler
; of a tick frame; non-tick frames see held state and mouse movement but no
; edges. A tap that starts and ends between two ticks is shown for one tick.
bExperimentalLatchInputEdges=0

; Research-only and capture-gated; requires
; bExperimentalRenderTranslationInterpolation. Keeps a from/to history of the
; 3D root position of every high-process actor and, during the scene draw
; only, shifts each actor's whole node subtree to the interpolated position,
; restoring it afterwards.
bExperimentalActorTranslationInterpolation=0

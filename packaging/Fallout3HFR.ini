; Fallout3HFR 1.0.0
;
; The switches you may want to change are in the first section. Everything
; under "Internals" has to stay as it is for the patch to work.
;
; To disable the patch without removing it, set bArmAtStartup=0.

[Timing]
; Master switch. 1 = the patch is active from game start. 0 = the game runs
; unmodified.
bArmAtStartup=1

; Simulation rate in ticks per second. The game is known to misbehave when
; simulated faster than 60. Leave at 60.
fSimulationHz=60.0

; Writes a status line to Fallout3HFR.log every five seconds, plus diagnostic
; traces. Only useful for reporting a problem: the file grows by several
; megabytes an hour. 0 = only a few lines per game start are written.
bTelemetry=0

; ---- Internals: do not change ----
bQuietTelemetry=1
bExperimentalQuantizedDelta=1
fMaxWallDeltaMs=250.0

[Experiments]
; Menus, conversations and the first 30 frames after them cannot use the
; patch's frozen in-between frames. With 1 they run on the real frame time
; instead, which keeps characters smooth there (for example a character
; turning to face you when a conversation starts), but it means the game is
; stepped at your frame rate on those frames. If you get a crash or a physics
; glitch right after closing a menu, set this to 0: menus then run at 60 ticks
; a second and those moments look stepped.
bExperimentalNativeStepUnfrozen=1

; Corrects the "spider hands" bug (the player's fingers stretching or shrinking
; in third person) by putting finger bones back to their normal length.
; 0 = leave the bones alone.
bExperimentalFingerLengthFix=1

; ---- Internals: do not change ----
bExperimentalHUDTimerNoSleep=1
bExperimentalFreezeRenderFrames=1
bExperimentalAlignHavokStep=1
bExperimentalLatchInputEdges=1
bExperimentalRenderTranslationInterpolation=1
bExperimentalActorTranslationInterpolation=1
bDebugActorObserveOnly=0
bDebugHandWriteTrace=0
fDebugActorOffsetZ=0
fDebugFirstPersonOffsetZ=0
bExperimentalSingleCoreFrame=0
bExperimentalSceneDrawReplay=0
bExperimentalPostPresentReplay=0
bExperimentalPostPresentSameFrameId=0
bExperimentalLeafResourceRetention=0
bExperimentalPostPresentLeafReplay=0
bExperimentalRenderCameraPositionInterpolation=0

[Tracing]
; ---- Internals: do not change ----
bFrameRegionTelemetry=0
bAuthoritativeStateTelemetry=0
bEventDispatchTelemetry=0
bSceneTransformTelemetry=1
